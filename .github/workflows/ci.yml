name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check

      # 直接调用二进制，避免 package.json script 里的 --fix 在 CI 中改动文件
      - name: Lint (oxlint)
        run: yarn oxlint . --deny-warnings

      - name: Lint (eslint)
        run: yarn eslint . --max-warnings 0

      - name: Build
        run: yarn build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
