name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, build & browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable

      # 直接调用二进制，避免 package.json script 里的 --fix 在 CI 中改动文件
      - name: Lint (oxlint)
        run: node .yarn/releases/yarn-4.18.1.cjs oxlint . --deny-warnings

      - name: Lint (eslint)
        run: node .yarn/releases/yarn-4.18.1.cjs eslint . --max-warnings 0

      - name: Type check and build
        run: node .yarn/releases/yarn-4.18.1.cjs build

      - name: Install Chromium
        run: node .yarn/releases/yarn-4.18.1.cjs playwright install --with-deps chromium

      - name: Browser tests
        run: node .yarn/releases/yarn-4.18.1.cjs test:e2e --project=chromium

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit direct and transitive dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs npm audit --all --recursive --severity high

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
